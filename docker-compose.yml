services:
  tchounis-pharmacy:
    image: ghcr.io/cleeryy/tchounis-pharmacy:latest
    container_name: tchounis-pharmacy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
